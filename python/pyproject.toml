[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bicbic416"
version = "0.3.0"
description = "Deneysel BicBic416 şifresiyle iki katmanlı (BicBic416 + ChaCha20) log kaydı şifreleme ve BicBic-Hash"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Emre Kadir Dağdelen" }]
keywords = ["cryptography", "logging", "encryption", "chacha20", "siem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Logging",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dagdelenemre/bicbic416"
Documentation = "https://github.com/dagdelenemre/bicbic416/blob/main/ENTEGRASYON.md"

[project.scripts]
bicbic416 = "bicbic416.__main__:main"

[tool.setuptools]
packages = ["bicbic416"]

[tool.setuptools.package-data]
bicbic416 = ["*.dll", "*.so", "*.dylib"]
